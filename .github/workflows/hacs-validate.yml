name: Validate with HACS

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on:
    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
    - name: HACS validation
      uses: hacs/action@main
      with:
        category: integration
        ignore: wheels

